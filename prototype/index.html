<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="VoltYard: EV battery inspections, charging and yard safety."><title>VoltYard · EV Yard Operations</title><style>
:root{
  --ground:#EDF0EE; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#172225; --muted:#5A6A6C; --line:#D5DCDA;
  --accent:#13627A; --accent-ink:#FFFFFF; --accent-soft:#DCEBEF; --marking:#E3B21B; --frame:#1D2A2D;
  --krit:#B8322A; --hoog:#CC6317; --middel:#9C7C06; --ok:#2B7D55;
  --krit-soft:#F7E1DF; --hoog-soft:#FBE8D8; --middel-soft:#F5EDCB; --ok-soft:#DCEFE4;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1618; --surface:#162124; --surface-2:#1B282C; --ink:#E1EAE8; --muted:#8FA1A3; --line:#28383C;
    --accent:#4FA6C2; --accent-ink:#0B1416; --accent-soft:#18343D; --marking:#E4C04B; --frame:#05090A;
    --krit:#F0776C; --hoog:#F29A55; --middel:#D8BE4E; --ok:#5FC08E;
    --krit-soft:#3A1E1C; --hoog-soft:#3A2717; --middel-soft:#343015; --ok-soft:#173026;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1618; --surface:#162124; --surface-2:#1B282C; --ink:#E1EAE8; --muted:#8FA1A3; --line:#28383C;
  --accent:#4FA6C2; --accent-ink:#0B1416; --accent-soft:#18343D; --marking:#E4C04B; --frame:#05090A;
  --krit:#F0776C; --hoog:#F29A55; --middel:#D8BE4E; --ok:#5FC08E;
  --krit-soft:#3A1E1C; --hoog-soft:#3A2717; --middel-soft:#343015; --ok-soft:#173026;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible,.nav button:focus-visible,.task:focus-visible,.step:focus-visible,.seg button:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.brand-name{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;line-height:1}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:8px 10px 8px 12px;border-radius:6px;border-left:3px solid transparent}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);border-left-color:var(--marking)}
.nav .l1{font-weight:600}
.nav .l2{font-size:12px;color:var(--muted)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--middel-soft);color:var(--middel);width:max-content}
main{min-width:0;padding-inline:28px;padding-block:22px 48px;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0;letter-spacing:.02em}
h3{font-size:14px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--display);font-weight:600;font-size:32px;line-height:1}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .s{font-size:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--krit);color:var(--krit)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-Critical{background:var(--krit-soft);color:var(--krit)} .p-High{background:var(--hoog-soft);color:var(--hoog)}
.p-Medium{background:var(--middel-soft);color:var(--middel)} .p-ok{background:var(--ok-soft);color:var(--ok)}
.p-neutral{background:var(--surface-2);color:var(--muted)} .p-info{background:var(--accent-soft);color:var(--accent)}
.code{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* tables */
.tablewrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.sev{padding:0;width:4px} td.sev span{display:block;width:4px;min-height:40px;height:100%}
.sev-Critical{background:var(--krit)} .sev-High{background:var(--hoog)} .sev-Medium{background:var(--middel)}
.r{text-align:right}

/* zones */
.zones{display:flex;flex-direction:column;gap:10px}
.zone{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px}
.zone .zc{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em}
.bar{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar i.over{background:var(--krit)}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}

/* chargers */
.chargers{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.ch{border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;font-size:11px;background:var(--surface-2)}
.ch b{display:block;font-family:var(--display);font-size:16px;font-weight:600}
.ch.occupied{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ch.defect{background:var(--krit-soft);border-color:var(--krit);color:var(--krit)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input,select.input{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.input.grow{flex:1 1 220px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}

/* detail */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dl div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.dl dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dl dd{margin:0;font-weight:600}
.big-soc{font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;width:100%;min-width:520px;height:auto}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.timeline li:last-child{border-bottom:0}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px 1fr;gap:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.alert > span{display:block}
.alert > div{padding:8px 10px 8px 0;display:flex;flex-direction:column;gap:2px}
.alert .act{font-size:12px;color:var(--muted)}

/* phone */
.phone-stage{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
.phone{border:10px solid var(--frame);border-radius:38px;background:var(--surface);overflow:hidden;min-height:720px;display:flex;flex-direction:column;box-shadow:0 20px 50px -24px rgba(10,30,35,.45)}
.phone-top{background:var(--accent);color:var(--accent-ink);padding:26px 18px 14px;display:flex;flex-direction:column;gap:2px}
.phone-top .t{font-family:var(--display);font-weight:600;font-size:22px}
.phone-top .s{font-size:12px;opacity:.85}
.phone-body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.task{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.task:hover{border-color:var(--accent)}
.bigbtn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.bigbtn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.bigbtn:focus-visible{outline:3px solid var(--marking)}
.socdial{display:flex;align-items:center;justify-content:space-between;gap:10px}
.socdial .n{font-family:var(--display);font-weight:700;font-size:64px;line-height:1}
.step{all:unset;cursor:pointer;width:52px;height:52px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--surface-2)}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:12px 0;border-radius:10px;border:1px solid var(--line);font-weight:600;background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--krit)}
.notice{padding:10px 12px;border-radius:8px;background:var(--hoog-soft);color:var(--ink);font-size:13px;display:flex;flex-direction:column;gap:8px}
.explain{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.explain ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.vinbox{font-family:var(--mono);font-size:17px;letter-spacing:.06em;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line);word-break:break-all}
.err{color:var(--krit);font-size:12px;font-weight:600}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,16,18,.55);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--surface);border-radius:10px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.doc-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cmp{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.cmp .n{font-family:var(--display);font-size:28px;font-weight:600}

@media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .grid-2,.phone-stage{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);z-index:20;gap:12px}
  .brand-sub,.rail-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{padding:6px 10px;border-left:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0}
  .nav button[aria-current="page"]{border-bottom-color:var(--marking)}
  .nav .l2{display:none}
  main{padding-inline:16px}
}
@media (max-width:520px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .phone{border:0;border-radius:12px;min-height:0} h1{font-size:28px} }
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .2s ease-out} @keyframes up{from{transform:translate(-50%,8px);opacity:0}} }


.rail{overflow:auto}.nav button{min-height:44px}.input{min-height:44px}.grow{flex:1}.ch.occupied{background:var(--accent-soft);border-color:var(--accent)}
@media(max-width:520px){.rail{flex-direction:column;align-items:stretch}.brand{display:none}.nav{max-width:100%}.nav button{flex-shrink:0}.zone{grid-template-columns:90px 1fr auto}.phone-stage{gap:16px}main{padding-inline:12px}.sheet{padding:14px}.btn{min-height:44px}}

  const age=day(today())-day(v.lastInspection),socAge=day(today())-day(v.history.at(-1).t),horizon=v.departure?Math.min(14,Math.max(0,day(v.departure)-day(today()))):14;

  if(action==='charge-stop'){const o=D.orders[v.vin];if(o?.status!=='Running')throw new Error('No running session.');const l=D.chargers.find(l=>l.code===o.charger);l.occupiedBy=null;const b=D.billing[v.fab];b.sessions++;b.kwh+=c.kwh??Math.max(0,c.soc-o.startSoc)/100*v.kwh/.9;v.soc=c.soc;v.history.push({t:today(),soc:c.soc,source:'Charging'});delete D.orders[v.vin];}

async function report(vin){
  const r=offline?{id:'PREVIEW-'+vin,generatedAt:new Date().toISOString(),vehicle:vehicle(vin),profile:profile(vehicle(vin)),chargingSessions:publicDemo?D.chargingSessions.filter(s=>s.vin===vin):[],audit:publicDemo?D.audit.filter(a=>a.subject===vin):[],alerts:evaluate(vehicle(vin))}:await api('/api/reports/'+vin),v=r.vehicle;
  modal('Handover report',`<div class="doc-head"><h2>VoltYard · Demo Terminal Zeebrugge</h2><div class="code">Report ${esc(r.id)}<br>Generated ${esc(r.generatedAt)}</div></div><dl class="dl">${[['VIN',vin],['Vehicle',v.model],['Profile',r.profile.id+' v'+r.profile.version],['Arrival',date(v.arrival)],['Departure',date(v.departure)],['Zone',v.zone]].map(([k,x])=>`<div><dt>${k}</dt><dd>${esc(x)}</dd></div>`).join('')}</dl><h3>Inspections</h3>${table(['Date','SOC','12V','Source','Profile','Actor'],v.history.map(h=>`<tr><td>${date(h.t)}</td><td>${h.soc}%</td><td>${h.twelveV||'—'}</td><td>${esc(h.source)}</td><td>${esc(h.profileId)} v${h.profileVersion||1}</td><td>${esc(h.actor)}</td></tr>`).join(''))}<h3>Charging sessions</h3>${table(['Start','End SOC','kWh','Energy source'],r.chargingSessions.map(s=>`<tr><td>${esc(s.start)}</td><td>${s.endSoc}%</td><td>${number(s.kwh)}</td><td>${s.estimatedKwh?'Estimated':'Metered'}</td></tr>`).join(''))}<h3>Quarantine case</h3>${v.dossier?`<dl class="dl">${[['Reason',v.dossier.reason],['Opened',date(v.dossier.opened)],['Decision',v.dossier.decision],['Justification',v.dossier.justification||'Not recorded'],['Reviewed by',v.dossier.decidedBy||'Not recorded']].map(([key,value])=>`<div><dt>${key}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl>`:'<p>None</p>'}<h3>Current alerts</h3>${showAlerts(r.alerts)}<h3>Audit events</h3>${table(['At','Actor','Action'],r.audit.map(a=>`<tr><td>${esc(a.at)}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td></tr>`).join(''))}<p class="muted">Snapshot of recorded terminal activity. This report does not certify battery condition or regulatory compliance.</p>${button('Print / Save as PDF','print','','primary')}`);
}
function login(error=''){
  document.getElementById('nav').innerHTML='';document.getElementById('session').textContent='Local development edition';
  document.getElementById('app').innerHTML=head('Sign in to VoltYard','EV battery care, charging and yard safety')+`<section class="panel" style="max-width:480px"><h2>Demo Terminal Zeebrugge</h2><p class="muted">Use a demo role to explore the application. All manufacturers and vehicle records are fictional.</p><form id="login-form" class="stack"><label class="f">Account<select class="input" name="user">${['admin','planner','operator','hse','account'].map(u=>`<option>${u}</option>`).join('')}</select></label><label class="f">Password<input class="input" type="password" name="password" required autocomplete="current-password"></label><button type="submit" class="btn primary">Sign in</button><p class="err" role="alert">${esc(error)}</p></form><span class="muted">Local development password: <code>VoltYard-demo-2026</code>. A configured environment password overrides this value.</span></section>`;
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,vin=el.dataset.vin,v=vehicle(vin);
  try{
    if(a==='close'){closeModal();return;}if(a==='print'){window.print();return;}
    if(a==='logout'){await api('/api/logout',{});user=null;D=null;alerts={};login();return;}
    if(a==='detail'){selected=vin;go('detail');return;}
    if(a==='inspect'){mobileVin=vin;page='field';history.pushState(null,'','#field/'+vin);render();return;}
    if(views[a]){go(a);return;}
    if(a==='previous'||a==='next'){offset=Math.max(0,offset+(a==='next'?50:-50));render();return;}
    if(a==='select-profile'){profileId=el.dataset.profile;draft=null;render();return;}
    if(a==='reset-profile'){draft=null;render();return;}
    if(a==='report'){await report(vin);return;}
    if(a==='billing-csv'){download('voltyard-energy.csv',[['manufacturer','sessions','kwh'],...D.manufacturers.map(f=>[f.name,D.billing[f.code]?.sessions||0,D.billing[f.code]?.kwh||0])]);return;}
    if(a==='emergency-csv'){download('voltyard-'+zoneId+'.csv',[['vin','model','soc','driveable','lastInspection'],...active().filter(v=>v.zone===zoneId).map(v=>[v.vin,v.model,v.history.length?v.soc:'unknown',v.history.length?v.driveable:'unknown',v.history.length?v.lastInspection:'unknown'])]);return;}
    let body={vin},action=a;
    if(a==='quarantine'){const reason=prompt('Describe the safety concern (at least 10 characters):');if(reason===null)return;body.reason=reason;}
    if(a==='isolate'){action='move';body.zone='Q-QUAR';}
    if(a==='move')body.zone=document.getElementById('move-zone').value;
    if(a==='decide'){body.decision=document.getElementById('decision-'+vin).value;body.justification=document.getElementById('reason-'+vin).value;}
    if(a==='plan'){body.departure=document.getElementById('departure').value;body.destination=document.getElementById('destination').value;}
    if(a==='depart'&&!confirm('Confirm departure? All vehicle alerts must be resolved.'))return;
    if(a==='charge-stop'){
      modal('Stop charging session',`<form id="stop-form" data-vin="${vin}" class="stack"><label class="f">Final observed SOC (%)<input class="input" name="soc" type="number" required min="${D.orders[vin].startSoc}" max="100" step="0.1" value="${target(v)}"></label><label class="f">Metered energy (kWh, optional)<input class="input" name="kwh" type="number" min="0" max="1000" step="0.01"></label><p class="muted">Leave energy blank to record an estimate using battery capacity and 90% efficiency. An over-target SOC remains visible as an alert.</p><button class="btn primary" type="submit">Complete session</button></form>`);return;
    }
    const result=await command(action,body);toast(result.message||'Changes saved.');
  }catch(error){toast(error.message);}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,values=new FormData(f);
  try{
    if(f.id==='login-form'){await api('/api/login',Object.fromEntries(values));await load();route();render();return;}
    if(f.id==='find-form'){const vin=String(values.get('vin')).trim().toUpperCase();if(!vehicle(vin))throw new Error('VIN not found in this yard.');mobileVin=vin;history.pushState(null,'','#field/'+vin);render();return;}
    if(f.id==='inspection-form'){
      const v=vehicle(mobileVin),soc=Number(values.get('soc'));let confirmed=false;
      if(soc<5||v.soc-soc>20){confirmed=confirm('Confirm this unusually low reading: '+soc+'%?');if(!confirmed)return;}
      await command('inspect',{vin:mobileVin,soc,twelveV:values.get('twelveV'),damage:values.has('damage'),suspected:values.has('suspected'),note:values.get('note'),confirm:confirmed});
      selected=mobileVin;go('detail');toast('Inspection saved. Alerts recalculated.');return;
    }
    if(f.id==='profile-form'){const p=D.profiles.find(p=>p.id===profileId),next={...p};for(const [key,val] of values)next[key]=Number(val);await command('profile',{profile:next});draft=null;render();toast('New profile version saved.');return;}
    if(f.id==='import-form'){if(offline&&!publicDemo)throw new Error('Start the .NET application to import a manifest.');const file=document.getElementById('csv-file').files[0];if(file.size>2000000)throw new Error('Maximum file size is 2 MB.');importResult=await command('import',{csv:await file.text()});render();return;}
    if(f.id==='stop-form'){await command('charge-stop',{vin:f.dataset.vin,soc:Number(values.get('soc')),kwh:values.get('kwh')===''?null:Number(values.get('kwh'))});closeModal();toast('Session completed and energy recorded.');}
  }catch(error){if(f.id==='login-form')login(error.message);else toast(error.message);}
});
document.addEventListener('input',e=>{
  if(e.target.id==='charging-search'){const value=e.target.value,pos=e.target.selectionStart;chargingQuery=value;render();const input=document.getElementById('charging-search');input.focus();input.setSelectionRange(pos,pos);}
  if(e.target.id==='search'){const value=e.target.value,pos=e.target.selectionStart;filter.q=value;offset=0;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos);}
  if(e.target.dataset.profileField){draft??={...D.profiles.find(p=>p.id===profileId)};draft[e.target.dataset.profileField]=Number(e.target.value);const affected=active().filter(v=>v.profile===profileId);document.getElementById('simulation').textContent=`${affected.filter(v=>evaluate(v,profile(v),true).length).length} vehicles with alerts now · ${affected.filter(v=>evaluate(v,draft,true).length).length} with these settings`;}
});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='manufacturer')filter.fab=e.target.value;if(id==='zone')filter.zone=e.target.value;if(id==='status')filter.status=e.target.value;if(['manufacturer','zone','status'].includes(id)){offset=0;render();}if(id==='emergency-zone'){zoneId=e.target.value;render();}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();const dialog=document.querySelector('.sheet');if(e.key==='Tab'&&dialog){const controls=[...dialog.querySelectorAll('button,input,select,textarea,a[href]')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
(async()=>{route();if(offline){D.orders={};D.audit=[];role='Admin';render();}else{try{await load();route();render();}catch{login();}}})();
</script></body></html>
